name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, raw model reasoning or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: ClaimAudit version
      placeholder: v2.1.0 or a full commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OpenClaw version, Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest safe input, command and observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
