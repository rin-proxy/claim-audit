name: Feature request
description: Propose a research workflow or verification improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or workflow problem
      description: Describe a concrete failure case or limitation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Suggested evaluation
      description: Explain how the improvement could be tested with synthetic or redistributable evidence.
