name: Verify offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash test.sh
      - name: Verify synthetic quick start
        run: bash examples/quickstart.sh
      - name: Check documentation contracts
        run: python3 scripts/check-docs.py
      - name: Compile public Python entrypoints
        run: python3 -m compileall -q scripts tests
